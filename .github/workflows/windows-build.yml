name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
      AZURE_CODE_SIGNING_NAME: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
      AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        # npm ci fails on Windows: lockfiles generated on macOS omit
        # platform-specific optional deps (long-standing npm bug).
        run: npm install --no-audit --no-fund

      - name: Release preflight
        shell: pwsh
        run: |
          node scripts/verify-release-version.mjs
          npm run check
          node --check server/index.js
          cargo check --manifest-path src-tauri/audio-convert/Cargo.toml

      - name: Build static whisper-cli
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.8.5 https://github.com/ggml-org/whisper.cpp.git "$env:RUNNER_TEMP\whisper.cpp"
          cmake -S "$env:RUNNER_TEMP\whisper.cpp" -B "$env:RUNNER_TEMP\whisper-build" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=OFF `
            -DGGML_NATIVE=OFF `
            -DWHISPER_BUILD_TESTS=OFF `
            -DWHISPER_BUILD_SERVER=OFF
          cmake --build "$env:RUNNER_TEMP\whisper-build" --config Release --target whisper-cli
          $whisperCli = Get-ChildItem "$env:RUNNER_TEMP\whisper-build" -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          if (-not $whisperCli) { throw "whisper-cli.exe was not built" }
          echo "PILLAR_WHISPER_CLI_PATH=$($whisperCli.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure Azure Trusted Signing
        shell: pwsh
        run: |
          cargo install trusted-signing-cli --locked
          $signCommand = "trusted-signing-cli -e $env:AZURE_ENDPOINT -a $env:AZURE_CODE_SIGNING_NAME -c $env:AZURE_CERT_PROFILE_NAME %1"
          $config = @{ bundle = @{ windows = @{ signCommand = $signCommand } } } | ConvertTo-Json -Depth 5
          Set-Content -Path src-tauri/tauri.sign.conf.json -Value $config

      - name: Test signing
        shell: pwsh
        run: |
          Copy-Item "$env:ProgramFiles\nodejs\node.exe" test-sign.exe
          trusted-signing-cli -e $env:AZURE_ENDPOINT -a $env:AZURE_CODE_SIGNING_NAME -c $env:AZURE_CERT_PROFILE_NAME test-sign.exe
          Remove-Item test-sign.exe

      - name: Build desktop app (signed)
        run: npm run desktop:build -- --config src-tauri/tauri.sign.conf.json

      - name: Verify Windows bundle inputs
        shell: pwsh
        run: |
          $required = @(
            "src-tauri/binaries/pillar-brief-backend-x86_64-pc-windows-msvc.exe",
            "src-tauri/binaries/pillar-audio-convert-x86_64-pc-windows-msvc.exe",
            "src-tauri/binaries/whisper-cli-x86_64-pc-windows-msvc.exe",
            "src-tauri/resources/whisper/models/ggml-tiny.en.bin"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing release bundle input: $path" }
          }

      - name: Prepare release assets
        shell: pwsh
        run: |
          $version = node -p 'require("./package.json").version'
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No NSIS installer found" }
          $sig = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe.sig" | Select-Object -First 1
          if (-not $sig) { throw "No NSIS updater signature found" }
          Copy-Item $exe.FullName "release/Pillar.Brief_${version}_x64-setup.exe"
          Copy-Item $sig.FullName "release/Pillar.Brief_${version}_x64-setup.exe.sig"
          Get-FileHash "release/Pillar.Brief_${version}_x64-setup.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  Pillar.Brief_${version}_x64-setup.exe" } |
            Set-Content "release/Pillar.Brief_${version}_x64-setup.exe.sha256"
          $notes = "docs/release-notes/${env:GITHUB_REF_NAME}.md"
          if (Test-Path $notes) {
            Copy-Item $notes "release-body.md"
          } else {
            Set-Content "release-body.md" "# Pillar Brief $version`n`nDesktop release artifacts for Pillar Brief."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: pillar-brief-windows
          path: release/*
          if-no-files-found: error

      - name: Upload assets to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: release-body.md
          fail_on_unmatched_files: true
