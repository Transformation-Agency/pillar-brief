name: Publish updater manifest

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.3"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish-latest-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Wait for updater assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          assets=(
            "Pillar.Brief_${VERSION}_aarch64.app.tar.gz"
            "Pillar.Brief_${VERSION}_aarch64.app.tar.gz.sig"
            "Pillar.Brief_${VERSION}_x64.app.tar.gz"
            "Pillar.Brief_${VERSION}_x64.app.tar.gz.sig"
            "Pillar.Brief_${VERSION}_x64-setup.exe"
            "Pillar.Brief_${VERSION}_x64-setup.exe.sig"
          )
          for attempt in {1..60}; do
            missing=0
            for asset in "${assets[@]}"; do
              if [ ! -f "release/$asset" ]; then
                if ! gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir release --clobber >/dev/null 2>&1; then
                  missing=1
                fi
              fi
            done
            if [ "$missing" = "0" ]; then
              ls -lh release
              exit 0
            fi
            echo "Waiting for updater assets for $RELEASE_TAG (attempt $attempt/60)..."
            sleep 30
          done
          echo "Timed out waiting for updater assets."
          exit 1

      - name: Fetch release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > "$RUNNER_TEMP/release-notes.md" || true
          echo "RELEASE_NOTES_FILE=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"

      - name: Generate latest.json
        run: node scripts/generate-updater-manifest.mjs

      - name: Validate latest.json
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("release/latest.json", "utf8"));
            const version = process.env.VERSION;
            const expected = {
              "darwin-aarch64": `Pillar.Brief_${version}_aarch64.app.tar.gz`,
              "darwin-x86_64": `Pillar.Brief_${version}_x64.app.tar.gz`,
              "windows-x86_64": `Pillar.Brief_${version}_x64-setup.exe`,
            };
            if (manifest.version !== version) throw new Error(`Expected version ${version}, got ${manifest.version}`);
            for (const [platform, asset] of Object.entries(expected)) {
              const entry = manifest.platforms?.[platform];
              if (!entry) throw new Error(`Missing platform ${platform}`);
              if (!entry.url?.endsWith(`/${asset}`)) throw new Error(`Bad URL for ${platform}: ${entry.url}`);
              if (!entry.signature) throw new Error(`Missing signature for ${platform}`);
            }
          '

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" release/latest.json --repo "$GITHUB_REPOSITORY" --clobber
          tmp="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$tmp" --clobber
          test -s "$tmp/latest.json"
